name: Run checks & tests on Pull Requests

on:
  - pull_request

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm run test:unit

      - name: Check formatting, lint and types
        run: npm run check
